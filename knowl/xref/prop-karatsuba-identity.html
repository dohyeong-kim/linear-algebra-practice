<article class="proposition theorem-like"><h3 class="heading">
<span class="type">명제</span><span class="space"> </span><span class="codenumber">7.3.1</span><span class="period">.</span><span class="space"> </span><span class="title">카라추바의 세 곱셈 항등식.</span>
</h3>
<div class="para logical">
<div class="para">다항식 <span class="process-math">\(A\text{,}\)</span> <span class="process-math">\(B\text{,}\)</span> <span class="process-math">\(C\text{,}\)</span> <span class="process-math">\(D\)</span>에 대하여 다음 항등식이 성립한다.</div>
<div class="displaymath process-math">
\begin{align*}
AD+BC &amp;= (A+B)(C+D)-AC-BD
\end{align*}
</div>
</div></article><details class="hiddenproof born-hidden-knowl"><summary class="knowl__link"><h3 class="heading"><span class="type">증명<span class="period">.</span></span></h3></summary><article class="hiddenproof knowl__content"><div class="para logical">
<div class="para">분배법칙으로 우변을 전개하면</div>
<div class="displaymath process-math">
\begin{align*}
(A+B)(C+D)-AC-BD &amp;= AC+AD+BC+BD-AC-BD\\
&amp;= AD+BC
\end{align*}
</div>
<div class="para">입니다. 따라서 주어진 항등식이 성립합니다.</div>
</div></article></details><span class="incontext"><a class="internal" href="sec-karatsuba.html#prop-karatsuba-identity">[incontext]</a></span>
