<div class="para">

<li><div class="para">
<span class="process-math">\(\|\alpha A\|=|\alpha|\,\|A\|\)</span>입니다.</div></li>
<li><div class="para">
<span class="process-math">\(\|A+B\|\leq\|A\|+\|B\|\)</span>입니다.</div></li>
