<div class="para logical">
<div class="para">벡터의 1-노름이 유도하는 행렬 <span class="process-math">\(A\in\mathbb C^{n\times n}\)</span>의 <dfn class="terminology">연산자 1-노름</dfn><aside class="aside aside-like"><div class="para">연산자 1-노름:operator 1-norm</div></aside>은</div>

\|A\|_1=\max_{x\neq 0}\frac{\|Ax\|_1}{\|x\|_1}
\end{equation*}

<div class="para">로 정의합니다.</div>
