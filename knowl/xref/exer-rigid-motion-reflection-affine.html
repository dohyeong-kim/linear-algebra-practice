<article class="exercise exercise-like"><h4 class="heading">
<span class="type">연습문제</span><span class="space"> </span><span class="codenumber">3<span class="period">.</span></span><span class="space"> </span><span class="title">직선에 대한 대칭과 동차좌표.</span>
</h4>
<div class="para">직선 <span class="process-math">\(\ell\)</span>이 방정식 <span class="process-math">\(x_2=1\)</span>로 주어져 있다. <span class="process-math">\(\ell\)</span>에 대한 대칭 <span class="process-math">\(S\)</span>를 좌표로 나타내고 <span class="process-math">\(S(x)=Qx+b\)</span>에서 <span class="process-math">\(Q\)</span>와 <span class="process-math">\(b\)</span>를 구하여라. <span class="process-math">\(S\)</span>의 <span class="process-math">\(3\times 3\)</span> 동차좌표행렬을 쓰고, 그 행렬의 제곱이 항등행렬임을 확인하여라. 또한 <span class="process-math">\(S(x)=x\)</span>를 만족하는 점들이 정확히 <span class="process-math">\(\ell\)</span> 위의 점들임을 보여라.</div></article><span class="incontext"><a class="internal" href="sec-2d-rigid-motion.html#exer-rigid-motion-reflection-affine">[incontext]</a></span>
