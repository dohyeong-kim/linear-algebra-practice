<article class="definition definition-like"><h3 class="heading">
<span class="type">정의</span><span class="space"> </span><span class="codenumber">5.1.1</span><span class="period">.</span><span class="space"> </span><span class="title">유향 그래프.</span>
</h3>
<div class="para">
<dfn class="terminology">유향 그래프</dfn><aside class="aside aside-like"><div class="para">유향 그래프:directed graph</div></aside>는 유한한 꼭짓점 집합 <span class="process-math">\(V\)</span>와 변의 집합 <span class="process-math">\(E \subseteq V \times V\)</span>로 이루어진 순서쌍 <span class="process-math">\((V,E)\)</span>입니다. <span class="process-math">\(V\)</span>의 원소를 꼭짓점이라 하고, <span class="process-math">\(E\)</span>의 원소 <span class="process-math">\((u,v)\)</span>를 <span class="process-math">\(u\)</span>에서 <span class="process-math">\(v\)</span>로 향하는 변이라 합니다. 여기서는 같은 꼭짓점에서 시작하고 끝나는 변도 허용합니다.</div></article><span class="incontext"><a class="internal" href="sec-graphs-and-incidence.html#def-directed-graph">[incontext]</a></span>
