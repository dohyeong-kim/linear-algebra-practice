<div class="para logical">
<div class="para">유한 차원 내적공간 사이의 선형사상 <span class="process-math">\(T:V\to W\)</span>와 그 수반사상 <span class="process-math">\(T^*:W\to V\)</span>에 대해, 양의 준정부호 자기수반사상 <span class="process-math">\(T^*T\)</span>의 고유값들의 음이 아닌 제곱근을 <dfn class="terminology">특이값</dfn>이라고 합니다. 중복도를 고려하여 특이값을</div>
<div class="displaymath process-math">
\begin{equation*}
\sigma_1\geq \sigma_2\geq\cdots\geq 0
\end{equation*}
</div>
<div class="para">로 나타냅니다.</div>
