</h3>
<div class="para">반복 부호 <span class="process-math">\(R_n=\{00\cdots0,11\cdots1\} \subset \mathbb F_2^n\)</span>는 차원이 <span class="process-math">\(1\)</span>인 부분공간입니다. 영벡터가 아닌 유일한 단어의 무게는 <span class="process-math">\(n\)</span>이므로, <span class="process-math">\(R_n\)</span>은 비율이 <span class="process-math">\(1/n\)</span>인 <span class="process-math">\([n,1,n]_2\)</span> 부호입니다. 예를 들어 <span class="process-math">\(n=3\)</span>이면 <span class="process-math">\(R_3=\{000,111\}\)</span>이고, 이는 <span class="process-math">\([3,1,3]_2\)</span> 부호입니다.</div></article><span class="incontext"><a class="internal" href="sec-hamming-distance.html#ex-repetition-code">[incontext]</a></span>
