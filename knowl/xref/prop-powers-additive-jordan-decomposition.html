<div class="para logical">
<div class="para">
<span class="process-math">\(T=T_s+T_n\)</span>이 가법 조르당 분해이고 <span class="process-math">\(T_n^d=0\)</span>이라고 하자. 그러면 모든 음이 아닌 정수 <span class="process-math">\(m\)</span>에 대하여</div>

T^m=\sum_{q=0}^{\min\{m,d-1\}}\binom{m}{q}T_s^{m-q}T_n^q
\end{gather*}
</div>
<div class="para">가 성립한다.</div>
