<article class="corollary theorem-like"><h3 class="heading">
<span class="type">따름정리</span><span class="space"> </span><span class="codenumber">4.3.4</span><span class="period">.</span><span class="space"> </span><span class="title">스펙트럼 반지름의 양의 고유벡터.</span>
</h3>
<div class="para">양의 행렬 <span class="process-math">\(A\)</span>에 대하여 <span class="process-math">\(\rho(A)&gt;0\)</span>이고, <span class="process-math">\(\rho(A)\)</span>에는 양의 고유벡터가 존재한다.</div></article><details class="hiddenproof born-hidden-knowl"><summary class="knowl__link"><h3 class="heading"><span class="type">증명<span class="period">.</span></span></h3></summary><article class="hiddenproof knowl__content"><div class="para">스펙트럼 원 위의 고윳값 <span class="process-math">\(\lambda\)</span>와 그 고유벡터 <span class="process-math">\(z\)</span>를 택합시다. <a href="sec-perron-frobenius.html#lem-perron-boundary-eigenvector-absolute-value" class="xref" data-knowl="./knowl/xref/lem-perron-boundary-eigenvector-absolute-value.html" data-reveal-label="Reveal" data-close-label="Close" title="보조정리 4.3.3: 스펙트럼 원 위 고유벡터의 절댓값">보조정리 4.3.3</a>에 의해 <span class="process-math">\(A|z|=\rho(A)|z|\)</span>입니다. 한편 <a href="sec-perron-frobenius.html#lem-positive-matrix-strict-order" class="xref" data-knowl="./knowl/xref/lem-positive-matrix-strict-order.html" data-reveal-label="Reveal" data-close-label="Close" title="보조정리 4.3.2: 양의 행렬의 순서 보존">보조정리 4.3.2</a>에 의해 <span class="process-math">\(A|z|\)</span>는 양의 벡터입니다. 따라서 <span class="process-math">\(\rho(A)&gt;0\)</span>이고 <span class="process-math">\(|z|\)</span>도 양의 벡터입니다.</div></article></details><span class="incontext"><a class="internal" href="sec-perron-frobenius.html#cor-perron-positive-eigenvector">[incontext]</a></span>
