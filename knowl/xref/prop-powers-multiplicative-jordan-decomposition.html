<article class="proposition theorem-like"><h3 class="heading">
<span class="type">명제</span><span class="space"> </span><span class="codenumber">4.1.6</span><span class="period">.</span><span class="space"> </span><span class="title">승법 조르당 분해에서의 거듭제곱.</span>
</h3>
<div class="para logical">
<div class="para">
<span class="process-math">\(T=T_sT_u=T_uT_s\)</span>이 승법 조르당 분해이고 <span class="process-math">\(T_u=I+U\text{,}\)</span> <span class="process-math">\(U^d=0\)</span>이라고 하자. 그러면 모든 음이 아닌 정수 <span class="process-math">\(m\)</span>에 대하여</div>
<div class="displaymath process-math">
\begin{gather*}
T^m=T_s^mT_u^m=T_s^m\sum_{q=0}^{\min\{m,d-1\}}\binom{m}{q}U^q
\end{gather*}
</div>
<div class="para">가 성립한다.</div>
</div></article><details class="hiddenproof born-hidden-knowl"><summary class="knowl__link"><h3 class="heading"><span class="type">증명<span class="period">.</span></span></h3></summary><article class="hiddenproof knowl__content"><div class="para">조르당 분해의 존재와 이항정리로부터 알 수 있습니다.</div></article></details><span class="incontext"><a class="internal" href="sec-powers-of-a-matrix.html#prop-powers-multiplicative-jordan-decomposition">[incontext]</a></span>
